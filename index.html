<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tug'ilgan kun tabrigi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;overflow-x:hidden}
body{background:linear-gradient(160deg,#2b1055,#7597de 130%);min-height:100%}
.hidden{display:none!important}

/* ---------- Generator ---------- */
#gen{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.box{width:100%;max-width:440px;background:rgba(255,255,255,.12);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.25);border-radius:22px;padding:26px}
.box h1{font-size:24px;margin-bottom:4px}
.box p.sub{opacity:.8;font-size:14px;margin-bottom:18px}
label{display:block;font-size:13px;margin:12px 0 5px;opacity:.9}
input,textarea{width:100%;padding:12px 14px;border-radius:12px;border:none;font-size:16px;font-family:inherit;background:rgba(255,255,255,.95);color:#222;outline:none}
textarea{resize:vertical;min-height:80px}
.row{display:flex;gap:10px}.row>div{flex:1}
button{font-family:inherit;cursor:pointer;border:none}
.btn{width:100%;margin-top:18px;padding:14px;border-radius:14px;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(135deg,#ff6a9e,#ff9a44);box-shadow:0 8px 20px rgba(255,106,158,.4)}
.btn:active{transform:scale(.98)}
.btn.sec{background:rgba(255,255,255,.2);box-shadow:none;margin-top:10px;font-size:15px;padding:12px}
#result{margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.25)}
#result input{font-size:13px}
.err{color:#ffd1d1;font-size:13px;margin-top:10px;min-height:16px}
.note{font-size:12px;opacity:.7;margin-top:10px}

/* ---------- Card ---------- */
#card{position:fixed;inset:0;overflow:hidden;touch-action:none;
  background:radial-gradient(circle at 50% 30%,#4a2a85,#1a0f3a 75%)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#msg{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 22px);text-align:center;padding:0 20px;pointer-events:none}
#msg h2{font-size:clamp(20px,5.5vw,30px);text-shadow:0 2px 12px rgba(0,0,0,.4)}
#msg p{margin-top:8px;opacity:.9;font-size:clamp(14px,3.8vw,17px)}
#actions{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;gap:12px;justify-content:center;padding:0 16px}
#actions .btn{width:auto;margin:0;padding:14px 26px}
#intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;background:radial-gradient(circle at 50% 30%,#4a2a85,#1a0f3a 75%);z-index:5}
#intro .big{font-size:64px}
#intro h1{font-size:clamp(24px,7vw,36px)}
#greet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);opacity:0;width:min(88vw,420px);
  background:rgba(255,255,255,.96);color:#3a1d5c;border-radius:24px;padding:28px 22px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.5);transition:all .8s cubic-bezier(.2,1.3,.4,1);z-index:4;pointer-events:none}
#greet.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
#greet .em{font-size:44px}
#greet h3{font-size:clamp(20px,6vw,28px);margin:6px 0;color:#d6336c}
#greet .nm{font-size:clamp(22px,6.5vw,32px);font-weight:800;margin:4px 0 10px;word-break:break-word}
#greet .tx{font-size:clamp(15px,4.2vw,19px);line-height:1.5;white-space:pre-wrap;word-break:break-word}
#greet .again{margin-top:16px;padding:10px 20px;border-radius:12px;background:#f1e7ff;color:#5b2a9a;font-size:14px;font-weight:600}
</style>
</head>
<body>

<!-- GENERATOR -->
<div id="gen">
  <div class="box">
    <h1>🎂 Tabrik yaratish</h1>
    <p class="sub">Ma'lumotlarni kiriting va tayyor havolani oling</p>
    <div class="row">
      <div><label>Ism</label><input id="fn" maxlength="30" placeholder="Masalan: Alisher"></div>
      <div><label>Familya</label><input id="ln" maxlength="30" placeholder="Masalan: Karimov"></div>
    </div>
    <label>Yosh</label>
    <input id="age" type="number" inputmode="numeric" min="1" max="100" placeholder="Masalan: 17">
    <label>Tabrik so'zi (ixtiyoriy)</label>
    <textarea id="txt" maxlength="400" placeholder="Tug'ilgan kuning bilan! Baxt, sog'lik va omad tilayman..."></textarea>
    <div id="baseWrap" class="hidden">
      <label>Sayt manzili (GitHub Pages havolangiz)</label>
      <input id="base" placeholder="https://username.github.io/repo/">
    </div>
    <div class="err" id="err"></div>
    <button class="btn" id="go">Yaratish</button>
    <div id="result" class="hidden">
      <label>Tayyor havola</label>
      <input id="link" readonly>
      <button class="btn sec" id="copy">📋 Nusxa olish</button>
      <button class="btn sec" id="open">👀 Ko'rish</button>
      <button class="btn sec hidden" id="share">📤 Ulashish</button>
      <p class="note" id="fnote"></p>
    </div>
  </div>
</div>

<!-- CARD -->
<div id="card" class="hidden">
  <canvas id="cv"></canvas>
  <div id="msg"><h2 id="mt"></h2><p id="mp"></p></div>
  <div id="actions"></div>
  <div id="greet">
    <div class="em">🎉🎂🎉</div>
    <h3>Tug'ilgan kuning bilan!</h3>
    <div class="nm" id="gname"></div>
    <div class="tx" id="gtext"></div>
    <button class="again" id="again">🔄 Qayta ko'rish</button>
  </div>
  <div id="intro">
    <div class="big">🎁</div>
    <h1 id="introT">Sizga tabrik bor!</h1>
    <button class="btn" id="start" style="width:auto;padding:14px 36px;margin:0">Ochish</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);

/* ---------- encode / decode ---------- */
function enc(o){
  const b=btoa(unescape(encodeURIComponent(JSON.stringify(o))));
  return b.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function dec(s){
  s=s.replace(/-/g,'+').replace(/_/g,'/');
  while(s.length%4)s+='=';
  return JSON.parse(decodeURIComponent(escape(atob(s))));
}

/* ---------- Generator ---------- */
const isWeb=/^https?:$/.test(location.protocol);
if(!isWeb)$('baseWrap').classList.remove('hidden');
let lastData=null;
function baseUrl(){
  if(isWeb)return location.origin+location.pathname;
  let b=$('base').value.trim();
  if(b&&!/^https?:\/\//.test(b))b='https://'+b;
  return b;
}
$('go').onclick=()=>{
  const fn=$('fn').value.trim(),ln=$('ln').value.trim(),age=parseInt($('age').value,10),t=$('txt').value.trim();
  if(!fn){$('err').textContent='Ismni kiriting';return}
  if(!age||age<1||age>100){$('err').textContent='Yoshni 1 dan 100 gacha kiriting';return}
  $('err').textContent='';
  lastData={f:fn,l:ln,a:age,t:t};
  $('result').classList.remove('hidden');
  const b=baseUrl();
  if(b){
    $('link').value=b.split('?')[0]+'?c='+enc(lastData);
    $('fnote').textContent='';
  }else{
    $('link').value='';
    $('fnote').textContent='Havola olish uchun faylni GitHub Pages\'ga joylang va yuqoridagi "Sayt manzili" maydoniga manzilini kiriting, so\'ng yana "Yaratish" ni bosing. Hozircha "Ko\'rish" orqali tabrikni shu yerning o\'zida ko\'rishingiz mumkin.';
  }
  if(navigator.share&&b)$('share').classList.remove('hidden');
};
$('copy').onclick=async()=>{
  if(!$('link').value)return;
  try{await navigator.clipboard.writeText($('link').value)}catch(e){$('link').select();document.execCommand('copy')}
  $('copy').textContent='✅ Nusxa olindi';setTimeout(()=>$('copy').textContent='📋 Nusxa olish',1800);
};
$('open').onclick=()=>{
  if(isWeb&&$('link').value){window.open($('link').value,'_blank');return}
  if(lastData){$('gen').classList.add('hidden');$('card').classList.remove('hidden');initCard(lastData)}
};
$('share').onclick=()=>{navigator.share({title:'Tug\'ilgan kun tabrigi',url:$('link').value}).catch(()=>{})};

/* ---------- Card ---------- */
const params=new URLSearchParams(location.search);
if(params.get('c')){
  let data=null;try{data=dec(params.get('c'))}catch(e){}
  if(data&&data.f&&data.a){$('gen').classList.add('hidden');$('card').classList.remove('hidden');initCard(data)}
}

function initCard(D){
  const N=Math.max(1,Math.min(100,parseInt(D.a,10)||1));
  const fullName=(D.f+' '+(D.l||'')).trim();
  $('gname').textContent=fullName;
  $('gtext').textContent=D.t||('Sizga ('+N+' yosh) baxt, sog\'lik va omad tilayman! Barcha orzularingiz amalga oshsin! 🎈');
  $('introT').textContent=fullName+', sizga tabrik bor!';

  const cv=$('cv'),ctx=cv.getContext('2d');
  let W,H,dpr,G;
  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=innerWidth;H=innerHeight;
    cv.width=W*dpr;cv.height=H*dpr;
    const rx=Math.min(W*.42,250),ry=rx*.34,h=rx*.62;
    G={cx:W/2,rx,ry,h,ty:Math.max(H*.52,ry+170)};
    layoutCandles();
  }

  /* candles */
  let candles=[];
  const colors=['#ff6b6b','#4dabf7','#ffd43b','#69db7c','#da77f2','#ff922b'];
  function layoutCandles(){
    const ch=Math.max(16,Math.min(44,G.rx*.18-N*.25)),cw=Math.max(3.5,Math.min(9,G.rx*.035-N*.03+3));
    const old=candles.map(c=>c.lit);
    candles=[];
    for(let i=0;i<N;i++){
      const r=Math.sqrt((i+.5)/N)*.78,th=i*2.399963;
      candles.push({x:G.cx+r*G.rx*Math.cos(th),y:G.ty+r*G.ry*Math.sin(th),ch,cw,col:colors[i%colors.length],lit:old[i]!==undefined?old[i]:true,ph:Math.random()*6});
    }
    candles.sort((a,b)=>a.y-b.y);
  }

  /* state */
  let stage='wait',smoke=[],conf=[],trail=[],pts=[],cut=null,cutT=0,blowAcc=0;
  function setMsg(t,p){$('mt').textContent=t;$('mp').textContent=p||''}
  function setActions(list){
    const a=$('actions');a.innerHTML='';
    list.forEach(([label,fn])=>{const b=document.createElement('button');b.className='btn';b.textContent=label;b.onclick=fn;a.appendChild(b)});
  }

  /* cake drawing */
  function band(y0,y1,fill){
    const{cx,rx,ry}=G;
    ctx.beginPath();
    ctx.moveTo(cx-rx,y0);ctx.lineTo(cx-rx,y1);
    ctx.ellipse(cx,y1,rx,ry,0,Math.PI,0,true);
    ctx.lineTo(cx+rx,y0);
    ctx.ellipse(cx,y0,rx,ry,0,0,Math.PI,false);
    ctx.closePath();ctx.fillStyle=fill;ctx.fill();
  }
  function drawCake(withTop){
    const{cx,rx,ry,h,ty}=G;
    ctx.beginPath();ctx.ellipse(cx,ty+h+4,rx*1.22,ry*1.25,0,0,7);ctx.fillStyle='#e9e4f5';ctx.fill();
    ctx.beginPath();ctx.ellipse(cx,ty+h+9,rx*1.22,ry*1.25,0,0,7);ctx.fillStyle='rgba(0,0,0,.25)';ctx.globalCompositeOperation='destination-over';ctx.fill();ctx.globalCompositeOperation='source-over';
    const g=ctx.createLinearGradient(cx-rx,0,cx+rx,0);
    g.addColorStop(0,'#e0568a');g.addColorStop(.5,'#ff8fb4');g.addColorStop(1,'#d04a7d');
    band(ty,ty+h,g);
    band(ty+h*.42,ty+h*.58,'#fff3d6');
    // top
    ctx.beginPath();ctx.ellipse(cx,ty,rx,ry,0,0,7);ctx.fillStyle='#fff7e6';ctx.fill();
    ctx.beginPath();ctx.ellipse(cx,ty,rx*.92,ry*.88,0,0,7);ctx.strokeStyle='#ffb3cc';ctx.lineWidth=3;ctx.stroke();
    // strawberries on rim
    for(let i=0;i<10;i++){
      const a=i/10*Math.PI*2,x=cx+Math.cos(a)*rx*.92,y=ty+Math.sin(a)*ry*.88;
      ctx.beginPath();ctx.arc(x,y,Math.max(4,rx*.03),0,7);ctx.fillStyle='#e03131';ctx.fill();
    }
  }
  function drawCandle(c,t){
    ctx.fillStyle=c.col;ctx.fillRect(c.x-c.cw/2,c.y-c.ch,c.cw,c.ch);
    ctx.fillStyle='rgba(255,255,255,.55)';
    for(let k=0;k<c.ch;k+=Math.max(6,c.ch/4)){ctx.fillRect(c.x-c.cw/2,c.y-c.ch+k,c.cw,2)}
    ctx.fillStyle='#333';ctx.fillRect(c.x-.5,c.y-c.ch-4,1,4);
    if(c.lit){
      const f=1+Math.sin(t*9+c.ph)*.12,fh=Math.max(7,c.cw*2.1)*f,fw=Math.max(3,c.cw*.55);
      const fy=c.y-c.ch-4;
      const gl=ctx.createRadialGradient(c.x,fy-fh/2,0,c.x,fy-fh/2,fh*2.2);
      gl.addColorStop(0,'rgba(255,200,80,.45)');gl.addColorStop(1,'rgba(255,200,80,0)');
      ctx.fillStyle=gl;ctx.fillRect(c.x-fh*2.2,fy-fh*2.7,fh*4.4,fh*4.4);
      ctx.beginPath();ctx.moveTo(c.x,fy-fh);
      ctx.quadraticCurveTo(c.x+fw,fy-fh*.3,c.x,fy);
      ctx.quadraticCurveTo(c.x-fw,fy-fh*.3,c.x,fy-fh);
      ctx.fillStyle='#ffb52e';ctx.fill();
      ctx.beginPath();ctx.ellipse(c.x,fy-fh*.28,fw*.4,fh*.25,0,0,7);ctx.fillStyle='#fff6c8';ctx.fill();
    }
  }

  function extinguish(n){
    const lit=candles.filter(c=>c.lit);
    for(let i=0;i<n&&lit.length;i++){
      const c=lit.splice(Math.floor(Math.random()*lit.length),1)[0];
      c.lit=false;
      for(let k=0;k<4;k++)smoke.push({x:c.x,y:c.y-c.ch-6,vx:(Math.random()-.5)*.4,vy:-.6-Math.random()*.6,a:.7,r:2+Math.random()*2});
    }
    if(stage==='blow'&&!candles.some(c=>c.lit))allOut();
  }
  function allOut(){
    stage='ask';stopMic();
    setMsg('Ura! Hamma shamlar o\'chdi 🎉','');
    setActions([['Tortni kesamizmi? 🔪',()=>{stage='cut';trail=[];pts=[];setMsg('Tortni kesing 🔪','Barmog\'ingizni tort ustidan sudrab o\'tkazing');setActions([])}]]);
  }

  /* mic */
  let actx=null,an=null,stream=null,buf=null;
  async function startMic(){
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      actx=new(window.AudioContext||window.webkitAudioContext)();
      const src=actx.createMediaStreamSource(stream);an=actx.createAnalyser();an.fftSize=1024;src.connect(an);buf=new Float32Array(an.fftSize);
      return true;
    }catch(e){return false}
  }
  function stopMic(){try{stream&&stream.getTracks().forEach(t=>t.stop());actx&&actx.close()}catch(e){}an=null;stream=null}
  function micLevel(){
    if(!an)return 0;an.getFloatTimeDomainData(buf);
    let s=0;for(let i=0;i<buf.length;i++)s+=buf[i]*buf[i];return Math.sqrt(s/buf.length);
  }

  /* start */
  $('start').onclick=async()=>{
    $('intro').classList.add('hidden');
    stage='blow';
    const ok=await startMic();
    setMsg(N+' yosh muborak! 🎂',ok?'Shamlarni puflab o\'chiring (mikrofonga puflang)':'Shamlarni o\'chirish uchun tugmani bosing');
    setActions([['💨 Puflash',()=>extinguish(Math.ceil(N/4)+1)]]);
  };
  $('again').onclick=()=>{
    $('greet').classList.remove('show');conf=[];cut=null;trail=[];pts=[];
    candles.forEach(c=>c.lit=true);stage='blow';
    startMic().then(ok=>{setMsg(N+' yosh muborak! 🎂',ok?'Shamlarni puflab o\'chiring':'Shamlarni o\'chirish uchun tugmani bosing');setActions([['💨 Puflash',()=>extinguish(Math.ceil(N/4)+1)]])});
  };

  /* swipe to cut */
  function inCake(x,y){
    const{cx,rx,ry,h,ty}=G;
    return Math.abs(x-cx)<rx*1.05&&y>ty-ry&&y<ty+h+ry;
  }
  let down=false;
  cv.addEventListener('pointerdown',e=>{
    if(stage==='blow'){extinguish(Math.ceil(N/6));return}
    if(stage!=='cut')return;
    down=true;trail=[];pts=[];cv.setPointerCapture(e.pointerId);addPt(e);
  });
  cv.addEventListener('pointermove',e=>{if(down&&stage==='cut')addPt(e)});
  const up=()=>{down=false;if(stage==='cut'){trail=[];pts=[]}};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  function addPt(e){
    const r=cv.getBoundingClientRect(),p={x:e.clientX-r.left,y:e.clientY-r.top};
    trail.push(p);if(trail.length>40)trail.shift();
    if(inCake(p.x,p.y)){
      pts.push(p);
      if(pts.length>2){
        const a=pts[0],b=pts[pts.length-1];
        if(Math.hypot(b.x-a.x,b.y-a.y)>G.rx*.9)doCut(a,b);
      }
    }
  }
  function doCut(a,b){
    stage='cutting';down=false;
    let dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy);
    if(l<30){dx=0;dy=1;l=1}
    cut={p:a,d:{x:dx/l,y:dy/l}};cut.n={x:-cut.d.y,y:cut.d.x};cutT=0;trail=[];
    setMsg('','');setActions([]);
    setTimeout(()=>{
      stage='done';
      for(let i=0;i<140;i++)conf.push({x:W/2,y:H*.4,vx:(Math.random()-.5)*14,vy:-Math.random()*14-3,c:colors[i%6],s:5+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4});
      $('greet').classList.add('show');
    },1300);
  }

  /* loop */
  let last=performance.now();
  function frame(now){
    const t=now/1000,dt=Math.min(.05,(now-last)/1000);last=now;
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
    // stars
    ctx.fillStyle='rgba(255,255,255,.5)';
    for(let i=0;i<40;i++){const x=(i*97%100)/100*W,y=(i*53%100)/100*H*.7,s=1+((i*7)%3)*.6;ctx.globalAlpha=.4+.4*Math.sin(t*2+i);ctx.fillRect(x,y,s,s)}
    ctx.globalAlpha=1;

    if(stage==='blow'&&an){
      const lv=micLevel();
      if(lv>.09){blowAcc+=dt*(lv*8);if(blowAcc>.06){extinguish(Math.ceil(N/25));blowAcc=0}}
    }

    if(cut){
      cutT=Math.min(1,cutT+dt/1.1);
      const gap=(1-Math.pow(1-cutT,3))*G.rx*.28;
      [-1,1].forEach(s=>{
        ctx.save();
        ctx.translate(cut.n.x*s*gap,cut.n.y*s*gap);
        const a={x:cut.p.x-cut.d.x*3000,y:cut.p.y-cut.d.y*3000},b={x:cut.p.x+cut.d.x*3000,y:cut.p.y+cut.d.y*3000};
        ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(b.x+cut.n.x*s*3000,b.y+cut.n.y*s*3000);ctx.lineTo(a.x+cut.n.x*s*3000,a.y+cut.n.y*s*3000);ctx.closePath();ctx.clip();
        drawCake();ctx.restore();
      });
    }else{
      drawCake();
      if(stage==='wait'||stage==='blow')candles.forEach(c=>drawCandle(c,t));
    }

    // finger hint
    if(stage==='cut'&&!down){
      const x=G.cx-G.rx*.6+((Math.sin(t*2)+1)/2)*G.rx*1.2,y=G.ty+G.h*.2;
      ctx.font=Math.round(G.rx*.25)+'px serif';ctx.textAlign='center';ctx.fillText('👆',x,y);
    }

    // trail (knife line)
    if(trail.length>1){
      ctx.lineCap='round';ctx.lineJoin='round';
      ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=4;ctx.shadowColor='#fff';ctx.shadowBlur=12;
      ctx.beginPath();trail.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.shadowBlur=0;
    }

    // smoke
    smoke=smoke.filter(s=>s.a>0.02);
    smoke.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.a-=dt*.5;s.r+=.05;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fillStyle='rgba(220,220,230,'+s.a+')';ctx.fill()});

    // confetti
    conf.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.vx*=.99;p.r+=p.vr;
      if(p.y>H+20){p.y=-10;p.vy=2;p.x=Math.random()*W}
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});

    requestAnimationFrame(frame);
  }

  addEventListener('resize',resize);
  resize();requestAnimationFrame(frame);
}
</script>
</body>
</html>
